name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The library and its tests target net8.0, net9.0 and net10.0, so all three runtimes are needed.
      # The SDK in global.json is 10.0.x.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/Falco.Datastar

      - name: Build
        run: dotnet build src/Falco.Datastar -c Release --no-restore

      - name: Test
        run: dotnet test test/Falco.Datastar.Tests -c Release

      # The examples are not part of the solution build on Linux, so build each one here.
      - name: Build the examples
        run: |
          for project in examples/*/*.fsproj; do
            dotnet build "$project" -c Release
          done
